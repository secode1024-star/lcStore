# CRMEB 相关配置
crmeb:
  version: CRMEB-JAVA-ET-v1.2 # 当前代码版本
  imagePath: E:/2zynt/StoreProject2kai/CRMEB-JAVA-ET-V1.2(2025.4.25)/et_java/crmebimage/ # 服务器图片路径配置 斜杠结尾
  asyncConfig: false #是否同步config表数据到redis
  paypalBrandName: Crmeb Java
  paypalReturnUri: https://H5域名/pages/order_pay_status/index

# 配置端口
server:
  port: 8001
  servlet:
    context-path: /         # 访问path
  tomcat:
    uri-encoding: UTF-8     # 默认编码格式
    max-threads: 1000       # 最大线程数量 默认200
    min-spare-threads: 30   # 初始化启动线程数量

spring:
  profiles:
    #  配置的环境
    #    active: #spring.profiles.active#
    active: prod
  servlet:
    multipart:
      max-file-size: 50MB #设置单个文件大小
      max-request-size: 50MB #设置单次请求文件的总大小
  application:
    name: cemrb-front #这个很重要，这在以后的服务与服务之间相互调用一般都是根据这个name
  jackson:
    locale: zh_CN
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  #  数据库配置
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/java_et?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8&autoReconnect=true&useUnicode=true&nullCatalogMeansCurrent=true&zeroDateTimeBehavior=convertToNull&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false
    username: java_et
    password: 111111
  redis:
    host: 127.0.0.1 #地址
    port: 6379 #端口
    password: 111111 # Redis密码
    timeout: 30000 # 连接超时时间（毫秒）
    database: 10  #默认数据库
    jedis:
      pool:
        max-active: 200 # 连接池最大连接数（使用负值表示没有限制）
        max-wait: -1 # 连接池最大阻塞等待时间（使用负值表示没有限制）
        max-idle: 10 # 连接池中的最大空闲连接
        min-idle: 0 # 连接池中的最小空闲连接
        time-between-eviction-runs: -1 #逐出扫描的时间间隔(毫秒) 如果为负数,则不运行逐出线程, 默认-1
  #  Email配置 - 阿里云邮件推送服务
  mail:
    # 配置阿里云邮件推送 SMTP 服务器地址
    host: smtpdm.aliyun.com
    # 发送者邮箱（阿里云邮件推送发信地址）
    username: server@hqlccn.com
    # 配置SMTP密码
    password: HQLccn123456
    # 端口号（阿里云邮件推送推荐25或80，ECS默认封禁25端口，使用80）
    port: 80
    # 默认的邮件编码为UTF-8
    default-encoding: UTF-8
    # 配置SMTP属性
    properties:
      mail:
        smtp:
          auth: true
          # 阿里云邮件推送不需要STARTTLS
          starttls:
            enable: false
          ssl:
            enable: false
          # 连接超时设置
          connectiontimeout: 5000
          timeout: 3000
          writetimeout: 5000
        #表示开启 DEBUG 模式，这样，邮件发送过程的日志会在控制台打印出来，方便排查错误
        debug: true
  messages:
    basename: i18n.mess
    encoding: UTF-8
#  配置国际化
lang:
  open: true
debug: true
logging:
  level:
    io.swagger.*: error
    com.zbjk.crmeb: debug
    org.springframework.boot.autoconfigure: ERROR
  config: classpath:logback-spring.xml
  file:
    path: ./crmeb_log

# mybatis 配置
mybatis-plus:
  mapper-locations: classpath*:mapper/*/*Mapper.xml #xml扫描，多个目录用逗号或者分号分隔（告诉 Mapper 所对应的 XML 文件位置）
  # 配置slq打印日志
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
#      logic-delete-field: isDel  #全局逻辑删除字段值 3.3.0开始支持，详情看下面。
      logic-delete-value: 1 # 逻辑已删除值(默认为 1)
      logic-not-delete-value: 0 # 逻辑未删除值(默认为 0)
      # SQL关键字保护 - 处理rank等保留字
      column-format: "`%s`"

#swagger 配置
swagger:
  basic:
    enable: true #是否开启
    check: false #是否打开验证
    username: #访问swagger的账号
    password: #访问swagger的密码

# 位置支付配置，文档地址 https://gitee.com/binary/weixin-java-tools
wx:
  pay:
    appId: 111111 #微信公众号或者小程序等的appid
    mchId: 111111 #微信支付商户号
    apiV3key: 111111 #APIv3密钥
    serialNo: 111111 #商户证书序列号
    privateKeyPath: /www/wwwroot/xxxx.cn/p12/apiclient_key.pem #p12证书的位置，可以指定绝对路径，也可以指定类路径（以classpath:开头） 商户私钥
    privateCertPath: /www/wwwroot/xxxxx.cn/p12/apiclient_cert.pem #p12证书的位置，可以指定绝对路径，也可以指定类路径（以classpath:开头）商户私钥
    notifyUrl: https://adminAPI域名/api/admin/payment/callback/wechat/pay #支付回调通知地址
    refundNotifyUrl: https://adminAPI域名/api/admin/payment/callback/wechat/refund #退款回调地址

