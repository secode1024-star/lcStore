# 翻译服务配置
# 百度翻译API频率控制配置

# 翻译请求间隔（毫秒）
# 百度翻译API QPS限制：
# - 免费版：1 QPS (1000ms间隔)
# - 标准版：1 QPS (1000ms间隔)  
# - 高级版：10 QPS (100ms间隔)
# - 尊享版：100 QPS (10ms间隔)
# 
# 由于网络延迟和服务器处理时间，建议设置比理论值更保守的间隔
# 如果频繁出现54003错误，可以增加此值
# 当前设置为1500ms，适用于标准版账户，确保不超过频率限制
translation.interval.ms=1500

# 频率限制错误后的额外延迟（毫秒）
# 54003错误后等待更长时间，让API服务器恢复
translation.rate.limit.delay.ms=10000

# 重试次数
translation.retry.max.attempts=3

# 重试基础延迟（毫秒）- 指数退避的基础值
# 增加基础延迟，减少重试频率
translation.retry.base.delay.ms=2000

# 批量翻译时的最大并发数（建议设为1，避免并发导致的频率限制）
translation.batch.max.concurrent=1

# 是否启用翻译缓存
translation.cache.enabled=true

# Redis缓存过期时间（秒）- 7天
translation.cache.redis.expire.seconds=604800

# 数据库缓存过期时间（小时）- 30天
translation.cache.db.expire.hours=720



