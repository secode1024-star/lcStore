# 翻译服务配置文件
# Translation Service Configuration

# Google翻译API配置
google.translate.api.key=YOUR_GOOGLE_API_KEY
google.translate.api.url=https://translation.googleapis.com/language/translate/v2
google.translate.enabled=true

# 百度翻译API配置
baidu.translate.app.id=YOUR_BAIDU_APP_ID
baidu.translate.secret.key=YOUR_BAIDU_SECRET_KEY
baidu.translate.api.url=https://fanyi-api.baidu.com/api/trans/vip/translate
baidu.translate.enabled=true

# 腾讯翻译API配置
tencent.translate.secret.id=YOUR_TENCENT_SECRET_ID
tencent.translate.secret.key=YOUR_TENCENT_SECRET_KEY
tencent.translate.region=ap-beijing
tencent.translate.enabled=false

# 翻译缓存配置
translation.cache.enabled=true
translation.cache.expire.hours=24
translation.cache.max.size=10000

# 翻译队列配置
translation.queue.enabled=true
translation.queue.batch.size=10
translation.queue.delay.seconds=1

# 支持的语言列表
translation.supported.languages=zh-CN,en,fr,th,lao,ja,ko,ar

# 默认翻译服务提供商 (google, baidu, tencent)
translation.default.provider=google

# 是否自动翻译新内容
translation.auto.translate.enabled=true

# 翻译失败重试次数
translation.retry.max.attempts=3
